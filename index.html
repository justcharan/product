<!DOCTYPE html>


<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
function regsiterlclick(){
document.getElementById("details").style.display="block";
document.getElementById("name").innerHTML=document.getElementById("pname").value;       
document.getElementById("price").innerHTML=document.getElementById("pprice").value;    
document.getElementById("city").innerHTML=document.getElementById("pcity").value;   
document.getElementById("stock").innerHTML=document.getElementById("pstock").value; 
stockstatus="";
stockbox=document.getElementById("pstock");
if(stockbox.checked){
    stockstatus="Available";
}
else{
    stockstatus="not Available";
}
document.getElementById("stock").innerHTML=stockstatus;
}
function save(){
    document.getElementById("btnreg").innerHTML="save";
}
</script>
</head>
<body class= "container-fluid">
    <div id="regbtn" class="mt-3"> 
    <button data-bs-target="#register" data-bs-toggle="modal"class="btn btn-primary"> Register product</button>
    </div>
    <div  id="details"style="display:none">
    <h3> Product Details</h3>
    <dl>
        <dt> Name</dt>
        <dd id="name"></dd>
        <dt>price</dt>
        <dd id="price"></dd>
        <dt>  city</dt>
        <dd id="city"></dd>
        <dt> stock</dt>
        <dd id="stock"></dd>
    </dl>
      <div>
        <button  onclick="save()"data-bs-target="#register" data-bs-toggle="modal" class="btn btn-success"><span class="bi bi-pencil-square"></span> Edit</button>
    </div>
    </div>
  
    <div class="modal" id="register">
     <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
  <h3> Register Product</h3>
  <button  data-bs-dismiss="modal"class="btn-close"></button>
            </div>
            <div  class="modal-body">
                <dl>
                    <dt> Product Name</dt>
                   <dd ><input type="text"id="pname" class="form-control"></dd> 
                    <dt> Price</dt>
                   <dd ><input type="text" id="pprice" class="form-control"></dd> 
                   <dt>Shipped to</dt>
                   <dd>
                    <select class="form-control" id="pcity">
                        <option></option>
                        <option>A.p</option>
                        <option>T.S</option>
                    </select>
                   </dd>
                   <dt>Stock</dt>
                   <dd >
                <input class="form-check-input" id="pstock" type="checkbox">Available
                   </dd>
                </dl>
            </div>
            <div class="modal-footer">
                <button id="btnreg" onclick="regsiterlclick()"data-bs-dismiss="modal"class="btn btn-primary">Register </button>
                <button data-bs-dismiss="modal" class="btn btn-danger">Cancel</button>
            </div>
        </div>
     </div>   
    </div>
</body>

</html>
